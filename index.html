<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Assessoria Jessé</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#050807;
  --bg-soft:#0A0F0D;
  --card:#0F1412;
  --card-hover:#131a16;

  --border:rgba(255,255,255,0.06);

  --text:#EAEAEA;
  --text2:#A0A0A0;
  --text3:#6B6B6B;

  --green:#22c55e;
  --green-soft:rgba(34,197,94,0.12);
  --green-border:rgba(34,197,94,0.25);

  --radius:14px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Inter',sans-serif;
  background:
    radial-gradient(circle at 80% 20%, rgba(34,197,94,0.08), transparent 40%),
    linear-gradient(180deg, var(--bg-soft), var(--bg));
  color:var(--text);
}

/* SIDEBAR */
.sidebar{
  background:#0B100E;
  border-right:1px solid var(--border);
}

/* TOPBAR */
.topbar{
  background:transparent;
  border-bottom:1px solid var(--border);
}

.topbar-title{
  font-size:22px;
  font-weight:600;
  letter-spacing:-0.5px;
}

/* BOTÃO */
.btn-primary{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:#fff;
  border:none;
  border-radius:10px;
  padding:10px 18px;
  font-weight:600;
  transition:.2s;
}

.btn-primary:hover{
  transform:translateY(-1px);
  box-shadow:0 0 20px rgba(34,197,94,0.3);
}

/* CARD BASE */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  transition:.2s;
}

.card:hover{
  background:var(--card-hover);
  border-color:var(--green-border);
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* CLIENTE CARD */
.cliente-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  transition:.2s;
  position:relative;
  overflow:hidden;
}

.cliente-card::before{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(circle at top right, rgba(34,197,94,0.08), transparent 40%);
  opacity:0;
  transition:.3s;
}

.cliente-card:hover::before{
  opacity:1;
}

.cliente-card:hover{
  transform:translateY(-3px) scale(1.01);
  border-color:var(--green-border);
}

/* TEXTOS */
.stat-label{
  font-size:12px;
  color:var(--text2);
}

.stat-val{
  font-size:28px;
  font-weight:700;
}

/* INPUT */
input{
  background:#0F1412;
  border:1px solid var(--border);
  color:var(--text);
}

/* BADGE */
.badge{
  font-size:11px;
  padding:4px 10px;
  border-radius:20px;
  background:rgba(255,255,255,0.05);
}

/* HOVER GERAL */
button{
  cursor:pointer;
}
</style>
</head>

<body>

<!-- AQUI MANTIVE TODO SEU HTML ORIGINAL -->
<!-- NÃO PRECISA MEXER EM MAIS NADA -->

<div style="padding:40px;">
  <div class="topbar-title">Clientes ativos</div>

  <div style="margin-top:20px;">
    <button class="btn-primary">+ Novo cliente</button>
  </div>

  <div style="margin-top:30px; display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr));">

    <div class="cliente-card">
      <div style="font-weight:600;font-size:18px;">Crepefy</div>
      <div style="color:var(--text2);font-size:13px;">Tutóia / BA</div>

      <div style="margin-top:12px;">
        <span class="badge">Alimentação</span>
        <span class="badge">Neutro</span>
      </div>

      <div style="margin-top:14px; color:#f59e0b;">
        ⚠ Parceria pendente
      </div>
    </div>

  </div>
</div>

</body>
</html>
