<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assessória Marketing Jessé</title>
<meta name="theme-color" content="#0a0a0f">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080818;--bg2:rgba(255,255,255,0.04);--bg3:rgba(255,255,255,0.07);--bg4:rgba(255,255,255,0.1);
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
  --text:#ffffff;--text2:#c8c4e0;--text3:#9490b0;
  --green:#4ade80;--green-bg:rgba(74,222,128,0.1);--green-border:rgba(74,222,128,0.25);
  --amber:#fbbf24;--amber-bg:rgba(251,191,36,0.1);--amber-border:rgba(251,191,36,0.25);
  --blue:#818cf8;--blue-bg:rgba(129,140,248,0.1);--blue-border:rgba(129,140,248,0.25);
  --red:#f87171;--red-bg:rgba(248,113,113,0.1);--red-border:rgba(248,113,113,0.25);
  --purple:#c084fc;--purple-bg:rgba(192,132,252,0.1);--purple-border:rgba(192,132,252,0.25);
  --radius:12px;--radius-sm:8px;--radius-lg:16px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.6;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 20% 10%,rgba(99,102,241,0.15) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 80% 80%,rgba(168,85,247,0.15) 0%,transparent 60%),linear-gradient(180deg,#080818 0%,#0d0d24 100%);}

.app{display:flex;min-height:100vh;}
.sidebar{width:230px;background:rgba(255,255,255,0.04);backdrop-filter:blur(24px);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .3s;}
.main{margin-left:230px;flex:1;min-height:100vh;position:relative;z-index:1;}

/* LOGIN */
.login-screen{position:fixed;inset:0;background:var(--bg);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{background:rgba(255,255,255,0.06);backdrop-filter:blur(24px);border:1px solid var(--border2);border-radius:24px;padding:40px;width:100%;max-width:420px;text-align:center;box-shadow:0 32px 80px rgba(0,0,0,0.5);}
.login-logo-name{font-size:24px;font-weight:700;margin-bottom:8px;}
.login-logo-name span{background:linear-gradient(135deg,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.login-user-btn{display:flex;align-items:center;gap:12px;padding:14px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:all .2s;margin-bottom:8px;width:100%;text-align:left;}
.login-user-btn:hover{background:rgba(255,255,255,0.1);transform:translateY(-2px);}
.luser-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;}
.login-input{width:100%;background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:10px;color:#fff;padding:12px;margin-bottom:12px;outline:none;}
.login-btn{width:100%;padding:13px;background:linear-gradient(135deg,#818cf8,#c084fc);color:#fff;border:none;border-radius:10px;font-weight:600;cursor:pointer;}
.login-err{color:var(--red);font-size:13px;margin-bottom:12px;display:none;}

/* Sidebar Items */
.sidebar-logo{padding:24px 20px;border-bottom:1px solid var(--border);}
.nav{padding:12px;flex:1;}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;cursor:pointer;color:var(--text2);font-size:14px;transition:all .2s;border:none;background:none;width:100%;text-align:left;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:var(--blue-bg);color:var(--blue);font-weight:600;}
.sidebar-footer{padding:16px;border-top:1px solid var(--border);}

/* Topbar */
.topbar{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:rgba(8,8,24,0.8);backdrop-filter:blur(20px);position:sticky;top:0;z-index:50;}

/* Content */
.content{padding:24px;}
.page{display:none;animation:fadeIn 0.4s ease-out;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* Cards & Stats */
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px;}
.stat{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:16px;padding:20px;}
.stat-label{font-size:12px;color:var(--text3);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;}
.stat-val{font-size:28px;font-weight:700;font-family:'JetBrains Mono',monospace;}
.card{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:16px;margin-bottom:16px;overflow:hidden;}
.card-header{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.card-body{padding:20px;}

/* Utils */
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;}
.badge-blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border);}
.badge-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);}
.badge-amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);}
.btn{padding:10px 18px;border-radius:10px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:0.2s;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-ghost{background:rgba(255,255,255,0.05);color:var(--text2);border:1px solid var(--border);}
.toast{position:fixed;bottom:24px;right:24px;background:var(--blue);color:#fff;padding:12px 24px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.3);transform:translateY(100px);transition:0.3s;z-index:9999;}
.toast.show{transform:translateY(0);}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%);}
  .main{margin-left:0;}
  .grid-4{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <div style="width:64px;height:64px;background:linear-gradient(135deg,#818cf8,#c084fc);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:32px;font-weight:800;color:#fff;">J</div>
    <div class="login-logo-name">Assessoria Marketing <span>Jessé</span></div>
    <div style="color:var(--text3);font-size:14px;margin-bottom:32px;">Selecione seu perfil</div>

    <div id="login-users">
      <button class="login-user-btn" onclick="selecionarUser(0)">
        <div class="luser-avatar" style="background:var(--green-bg);color:var(--green);">JM</div>
        <div>
          <div style="font-weight:600;">Jessé</div>
          <div style="font-size:12px;color:var(--text3);">Gestor - Acesso Total</div>
        </div>
      </button>
      <button class="login-user-btn" onclick="selecionarUser(1)">
        <div class="luser-avatar" style="background:var(--blue-bg);color:var(--blue);">NY</div>
        <div>
          <div style="font-weight:600;">Nayara</div>
          <div style="font-size:12px;color:var(--text3);">Social Media</div>
        </div>
      </button>
      <button class="login-user-btn" onclick="selecionarUser(2)">
        <div class="luser-avatar" style="background:var(--purple-bg);color:var(--purple);">PA</div>
        <div>
          <div style="font-weight:600;">Patricia</div>
          <div style="font-size:12px;color:var(--text3);">Gerente de Operações</div>
        </div>
      </button>
    </div>

    <div id="senha-box" style="display:none;margin-top:24px;">
      <div id="login-err" class="login-err">Senha incorreta</div>
      <input type="password" id="login-pass" class="login-input" placeholder="Digite sua senha..." onkeydown="if(event.key==='Enter')fazerLogin()">
      <button class="login-btn" onclick="fazerLogin()">Entrar no Painel</button>
    </div>
  </div>
</div>

<!-- PAINEL PRINCIPAL -->
<div class="app" id="painel" style="display:none;">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
        <div style="font-size:18px;font-weight:800;">Marketing <span>Jessé</span></div>
        <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-top:4px;">Sistema de Gestão</div>
    </div>
    <nav class="nav" id="main-nav"></nav>
    <div class="sidebar-footer">
      <div style="display:flex;align-items:center;gap:10px;">
        <div id="footer-avatar" style="width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;"></div>
        <div style="flex:1;">
          <div id="footer-name" style="font-size:13px;font-weight:600;"></div>
          <div id="footer-role" style="font-size:11px;color:var(--text3);"></div>
        </div>
        <button onclick="fazerLogout()" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:18px;">⏻</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div style="font-weight:700;font-size:18px;" id="page-title">Visão Geral</div>
      <div id="topbar-date" style="font-family:'JetBrains Mono';font-size:13px;color:var(--text3);"></div>
    </div>
    
    <div class="content">
      <!-- HOME -->
      <div class="page active" id="page-home">
        <div class="grid-4">
          <div class="stat"><div class="stat-label">Clientes</div><div class="stat-val" id="stat-clientes">0</div></div>
          <div class="stat"><div class="stat-label">Tarefas</div><div class="stat-val" id="stat-tarefas" style="color:var(--amber);">0</div></div>
          <div class="stat"><div class="stat-label">Mentorias</div><div class="stat-val" id="stat-mentorias" style="color:var(--purple);">0</div></div>
          <div class="stat"><div class="stat-label">Receita</div><div class="stat-val" id="stat-receita" style="color:var(--green);">R$ 0</div></div>
        </div>
        <div class="card">
            <div class="card-header">Últimas Tarefas</div>
            <div class="card-body" id="home-tarefas-list"></div>
        </div>
      </div>

      <!-- CLIENTES -->
      <div class="page" id="page-clientes">
        <div style="display:flex;justify-content:space-between;margin-bottom:24px;">
            <h3>Lista de Clientes</h3>
            <button class="btn btn-primary" onclick="alert('Funcionalidade de cadastro em breve!')">+ Novo Cliente</button>
        </div>
        <div id="clientes-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;"></div>
      </div>

      <!-- FINANCEIRO -->
      <div class="page" id="page-financeiro">
        <h3>Financeiro</h3>
        <p style="color:var(--text3);margin-top:12px;">Módulo em desenvolvimento.</p>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// CONFIGURAÇÕES E DADOS INICIAIS
const USERS = [
  {id:'jesse', name:'Jessé', initials:'JM', role:'Gestor', color:'#4ade80', bg:'rgba(74,222,128,0.15)', pass:'Sucesso@2024', pages:['home','clientes','financeiro']},
  {id:'nayara', name:'Nayara', initials:'NY', role:'Social Media', color:'#818cf8', bg:'rgba(129,140,248,0.15)', pass:'Pracima321', pages:['home','clientes']},
  {id:'patricia', name:'Patrícia', initials:'PA', role:'Gerente Operação', color:'#c084fc', bg:'rgba(192,132,252,0.15)', pass:'Juntos@123', pages:['home','clientes']}
];

const PAGE_NAMES = {home:'Visão geral', clientes:'Clientes', financeiro:'Financeiro'};
const NAV_ICONS = {home:'🏠', clientes:'👥', financeiro:'💰'};

let currentUser = null;
let selectedUserIdx = null;
let D = { clientes: [], tarefas: [], mentorias: [], pagamentos: [] };

// SISTEMA DE LOGIN
function selecionarUser(idx) {
  selectedUserIdx = idx;
  document.getElementById('login-users').style.opacity = '0.5';
  document.getElementById('senha-box').style.display = 'block';
  document.getElementById('login-pass').focus();
  document.getElementById('login-err').style.display = 'none';
}

function fazerLogin() {
  const pass = document.getElementById('login-pass').value;
  const user = USERS[selectedUserIdx];
  const err = document.getElementById('login-err');

  if (pass === user.pass) {
    currentUser = user;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('painel').style.display = 'flex';
    iniciarPainel();
  } else {
    err.style.display = 'block';
    document.getElementById('login-pass').value = '';
  }
}

function fazerLogout() {
    location.reload();
}

// INICIALIZAÇÃO DO PAINEL
function iniciarPainel() {
  const u = currentUser;
  const av = document.getElementById('footer-avatar');
  av.textContent = u.initials;
  av.style.background = u.bg;
  av.style.color = u.color;
  document.getElementById('footer-name').textContent = u.name;
  document.getElementById('footer-role').textContent = u.role;

  // Gerar Navegação
  const nav = document.getElementById('main-nav');
  nav.innerHTML = '';
  u.pages.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'nav-item' + (p === 'home' ? ' active' : '');
    btn.innerHTML = `<span style="margin-right:10px">${NAV_ICONS[p]}</span> ${PAGE_NAMES[p]}`;
    btn.onclick = () => goPage(p, btn);
    nav.appendChild(btn);
  });

  setDate();
  loadData();
  renderAll();
  toast(`Bem-vindo, ${u.name}!`);
}

function setDate() {
  const now = new Date();
  const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  document.getElementById('topbar-date').textContent = now.toLocaleDateString('pt-BR', options);
}

function goPage(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('page-title').textContent = PAGE_NAMES[name];
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// DADOS MOCK (SIMULADOS)
function loadData() {
    D.clientes = [
        {nome: 'Crepefy Recreio', nicho: 'Alimentação', status: 'Ativo', valor: 1500},
        {nome: 'Estética Glow', nicho: 'Estética', status: 'Ativo', valor: 2000},
        {nome: 'Restaurante Sabor', nicho: 'Restaurante', status: 'Em onboarding', valor: 1800}
    ];
    D.tarefas = [
        {nome: 'Arte Reels Promocional', cliente: 'Crepefy', status: 'Pendente'},
        {nome: 'Configurar Gestor de Anúncios', cliente: 'Estética Glow', status: 'Pendente'}
    ];
}

function renderAll() {
    // Stats
    document.getElementById('stat-clientes').textContent = D.clientes.length;
    document.getElementById('stat-tarefas').textContent = D.tarefas.length;
    document.getElementById('stat-mentorias').textContent = '12';
    document.getElementById('stat-receita').textContent = 'R$ 5.300';

    // Lista Home
    const list = document.getElementById('home-tarefas-list');
    list.innerHTML = D.tarefas.map(t => `
        <div style="display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid var(--border);">
            <div>
                <div style="font-weight:600;">${t.nome}</div>
                <div style="font-size:12px; color:var(--text3);">${t.cliente}</div>
            </div>
            <span class="badge badge-amber">${t.status}</span>
        </div>
    `).join('') || '<p style="color:var(--text3)">Sem tarefas pendentes.</p>';

    // Grid Clientes
    const grid = document.getElementById('clientes-grid');
    grid.innerHTML = D.clientes.map(c => `
        <div class="card">
            <div class="card-body">
                <div style="font-weight:700; font-size:18px;">${c.nome}</div>
                <div style="color:var(--text3); font-size:13px; margin-bottom:15px;">${c.nicho}</div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="badge ${c.status === 'Ativo' ? 'badge-green' : 'badge-amber'}">${c.status}</span>
                    <div style="font-weight:700;">R$ ${c.valor}</div>
                </div>
            </div>
        </div>
    `).join('');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
