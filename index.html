<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidinha do Jessé</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
:root{
--bg:#070b14;--bg2:#0d1321;
--card:rgba(255,255,255,0.045);--card2:rgba(255,255,255,0.08);
--border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.15);
--txt:#e2e8f0;--txt2:#94a3b8;--txt3:#475569;
--blue:#3b82f6;--blue-d:rgba(59,130,246,0.15);
--green:#22c55e;--green-d:rgba(34,197,94,0.13);
--yellow:#eab308;--yellow-d:rgba(234,179,8,0.13);
--red:#ef4444;--red-d:rgba(239,68,68,0.13);
--gray:#64748b;--gray-d:rgba(100,116,139,0.13);
--env-alpha:0.55;--env-r:59;--env-g:130;--env-b:246;
--sw:224px;--nh:62px;--r:16px;--rs:9px;--rl:22px;
--ease:.2s cubic-bezier(.4,0,.2,1)
}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px}
#cv{position:fixed;inset:0;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;display:flex;height:100vh}

/* SIDEBAR */
#sb{width:var(--sw);flex-shrink:0;height:100vh;display:flex;flex-direction:column;
  background:rgba(5,8,16,.9);backdrop-filter:blur(24px);
  border-right:1px solid var(--border)}
.sb-logo{padding:22px 20px 18px;border-bottom:1px solid var(--border)}
.sb-logo h1{font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--blue)}
.sb-logo p{font-size:10px;color:var(--txt3);margin-top:2px}
.nav-list{flex:1;padding:12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.ni{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:var(--rs);
  cursor:pointer;transition:all var(--ease);color:var(--txt3);font-size:13px;font-weight:500;
  border:1px solid transparent}
.ni:hover{color:var(--txt2);background:var(--card)}
.ni.active{color:var(--blue);background:var(--blue-d);border-color:rgba(59,130,246,.22)}
.ni svg{width:17px;height:17px;flex-shrink:0;stroke-width:2}
.ni-badge{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--green)}
.ni-badge.y{background:var(--yellow)}.ni-badge.r{background:var(--red)}
.sb-foot{padding:14px 20px;border-top:1px solid var(--border)}
.sb-ov-l{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.sb-ov-v{font-size:13px;font-weight:700;color:var(--blue)}

/* MAIN CONTENT */
#ct{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;padding:28px 32px;opacity:0;pointer-events:none;transition:opacity var(--ease)}
.view.active{opacity:1;pointer-events:all}
.view::-webkit-scrollbar{width:3px}
.view::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* BIG HERO */
.hero{position:relative;background:linear-gradient(135deg,rgba(59,130,246,.12) 0%,rgba(59,130,246,.03) 100%);
  border:1px solid rgba(59,130,246,.22);border-radius:var(--rl);padding:26px 28px;margin-bottom:22px;overflow:hidden}
.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:180px;height:180px;
  border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.15) 0%,transparent 70%);pointer-events:none}
.hero-tag{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.hero-title{font-size:32px;font-weight:900;letter-spacing:-.03em;line-height:1;margin-bottom:8px}
.hero-phrase{font-size:15px;color:var(--txt2);line-height:1.5;font-weight:400}
.hero-score{position:absolute;top:26px;right:28px;text-align:right}
.hero-num{font-size:52px;font-weight:900;letter-spacing:-.04em;color:var(--blue);line-height:1;opacity:.7}
.hero-lbl{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}

/* 4 MODULE CARDS */
.mod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:22px}
.mod-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:20px;cursor:pointer;transition:all var(--ease);position:relative;overflow:hidden;min-height:130px;
  display:flex;flex-direction:column;justify-content:space-between}
.mod-card:hover{background:var(--card2);transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.35)}
.mod-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mod-tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3)}
.mod-status{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-bottom:6px}
.mod-phrase{font-size:12px;color:var(--txt2);line-height:1.4}
.mod-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dot-g{background:var(--green);box-shadow:0 0 7px var(--green)}
.dot-y{background:var(--yellow);box-shadow:0 0 7px var(--yellow)}
.dot-r{background:var(--red);box-shadow:0 0 7px var(--red)}
.dot-b{background:var(--blue);box-shadow:0 0 7px var(--blue)}
.dot-gy{background:var(--gray)}
.pbar{height:4px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;margin-top:10px}
.pfill{height:100%;border-radius:99px;transition:width .5s ease}

/* SATISFACTION HERO */
.sat-hero{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);
  padding:24px;margin-bottom:20px}
.sat-phrase{font-size:20px;font-weight:700;line-height:1.3;margin-bottom:18px}
.sat-counts{display:flex;gap:0;margin-bottom:18px;border-radius:var(--r);overflow:hidden;border:1px solid var(--border)}
.sat-col{flex:1;padding:18px 12px;text-align:center;transition:all var(--ease)}
.sat-col+.sat-col{border-left:1px solid var(--border)}
.sat-num{font-size:48px;font-weight:900;line-height:1;margin-bottom:4px}
.sat-name{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;opacity:.8}
.sat-thermo{height:14px;border-radius:99px;overflow:hidden;display:flex;gap:3px;background:rgba(255,255,255,.05)}
.tseg{height:100%;border-radius:99px;transition:all .5s ease}

/* CARDS BASE */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;transition:all var(--ease)}
.card:hover{background:var(--card2)}
.cg-g{box-shadow:0 0 20px rgba(34,197,94,.1);border-color:rgba(34,197,94,.22)}
.cg-y{box-shadow:0 0 20px rgba(234,179,8,.1);border-color:rgba(234,179,8,.22)}
.cg-r{box-shadow:0 0 20px rgba(239,68,68,.1);border-color:rgba(239,68,68,.22)}
.cg-b{box-shadow:0 0 20px rgba(59,130,246,.1);border-color:rgba(59,130,246,.22)}
.cl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--txt3);margin-bottom:5px}
.cv{font-size:26px;font-weight:700;letter-spacing:-.02em}
.cs{font-size:11px;color:var(--txt3);margin-top:3px}

/* GRIDS */
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}

/* BADGE */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
.b-g{background:var(--green-d);color:var(--green)}.b-y{background:var(--yellow-d);color:var(--yellow)}
.b-r{background:var(--red-d);color:var(--red)}.b-b{background:var(--blue-d);color:var(--blue)}.b-gy{background:var(--gray-d);color:var(--gray)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 14px;
  border-radius:var(--rs);font-size:12px;font-weight:500;cursor:pointer;
  border:1px solid var(--border);background:var(--card);color:var(--txt2);transition:all var(--ease);white-space:nowrap}
.btn:hover{background:var(--card2);color:var(--txt)}
.btn-p{background:var(--blue-d);border-color:rgba(59,130,246,.3);color:var(--blue)}
.btn-p:hover{background:rgba(59,130,246,.25);border-color:var(--blue)}
.btn-g{background:var(--green-d);border-color:rgba(34,197,94,.3);color:var(--green)}
.btn-g:hover{background:rgba(34,197,94,.2)}
.btn-y{background:var(--yellow-d);border-color:rgba(234,179,8,.3);color:var(--yellow)}
.btn-r{background:var(--red-d);border-color:rgba(239,68,68,.3);color:var(--red)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--txt3)}
.btn-ghost:hover{background:var(--card);border-color:var(--border);color:var(--txt2)}

/* TOGGLES PILL */
.tg{display:inline-flex;align-items:center;padding:6px 14px;border-radius:99px;font-size:12px;
  font-weight:500;cursor:pointer;border:1px solid var(--border);background:transparent;
  color:var(--txt3);transition:all var(--ease);line-height:1}
.tg:hover{color:var(--txt2);background:var(--card)}
.ag{background:var(--green-d)!important;border-color:rgba(34,197,94,.45)!important;color:var(--green)!important}
.ay{background:var(--yellow-d)!important;border-color:rgba(234,179,8,.45)!important;color:var(--yellow)!important}
.ar{background:var(--red-d)!important;border-color:rgba(239,68,68,.45)!important;color:var(--red)!important}
.ab{background:var(--blue-d)!important;border-color:rgba(59,130,246,.45)!important;color:var(--blue)!important}
.aGy{background:var(--gray-d)!important;border-color:rgba(100,116,139,.45)!important;color:var(--gray)!important}

/* DIVIDER */
.divd{display:flex;align-items:center;gap:10px;margin:20px 0 14px}
.divd h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--txt3);white-space:nowrap}
.divd::after{content:'';flex:1;height:1px;background:var(--border)}

/* ALERT */
.alert{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:var(--rs);font-size:12px;font-weight:500}
.al-r{background:var(--red-d);color:var(--red)}.al-y{background:var(--yellow-d);color:var(--yellow)}.al-b{background:var(--blue-d);color:var(--blue)}

/* CLIENT CARD */
.cc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;transition:all var(--ease);position:relative}
.cc:hover{background:var(--card2)}
.cc-name{font-size:15px;font-weight:600;margin-bottom:2px}
.cc-meta{font-size:11px;color:var(--txt3);margin-bottom:12px}
.cc-val{font-size:16px;font-weight:700;color:var(--txt2)}
.cc-rows{display:flex;flex-direction:column;gap:7px}
.cc-row{display:flex;gap:5px;flex-wrap:wrap}
.btn-rm{position:absolute;top:11px;right:11px;width:22px;height:22px;border-radius:50%;
  border:1px solid var(--border);background:transparent;color:var(--txt3);font-size:11px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:all var(--ease)}
.cc:hover .btn-rm{opacity:1}
.btn-rm:hover{background:var(--red-d);border-color:rgba(239,68,68,.4);color:var(--red)}
.cli-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}

/* ACTIVITY */
.actv{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:14px}
.actv-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.actv-name{font-size:17px;font-weight:700}

/* DAY GRID */
.dgrid{display:flex;gap:8px}
.dcell{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.dlbl{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3)}
.dbtn{width:42px;height:42px;border-radius:var(--rs);border:1px solid var(--border);
  background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:all var(--ease);color:var(--green)}
.dbtn:hover:not(:disabled){background:var(--card2)}
.dbtn.done{background:var(--green-d);border-color:rgba(34,197,94,.45)}
.dbtn.today{border-color:var(--blue)!important}
.dbtn:disabled{opacity:.25;cursor:not-allowed}

/* COUNTER */
.counter{display:flex;align-items:center;gap:10px;margin:14px 0}
.cval{font-size:30px;font-weight:800;min-width:60px;text-align:center;letter-spacing:-.02em}
.cunit{font-size:12px;color:var(--txt3)}

/* TASK ITEM */
.task-item{display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;background:rgba(255,255,255,.025);border-radius:10px;
  border:1px solid var(--border);transition:all var(--ease)}
.task-item.done-t{border-color:rgba(34,197,94,.22);background:rgba(34,197,94,.04)}
.task-cb{width:24px;height:24px;border-radius:6px;border:2px solid var(--border);
  background:transparent;cursor:pointer;color:var(--green);font-size:14px;
  display:flex;align-items:center;justify-content:center;transition:all var(--ease);flex-shrink:0}
.task-cb.on{border-color:var(--green);background:var(--green-d)}
.task-name{font-size:14px;font-weight:500;transition:all var(--ease)}
.task-name.done-n{text-decoration:line-through;color:var(--txt3)}
.task-thresh{font-size:10px;color:var(--txt3);margin-top:1px}

/* MINI WEEK */
.mday{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.md-g{background:var(--green-d);color:var(--green)}.md-y{background:var(--yellow-d);color:var(--yellow)}
.md-r{background:var(--red-d);color:var(--red)}.md-e{background:var(--card);color:var(--txt3);border:1px solid var(--border)}

/* HISTORY SECTION */
.hist-week{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:8px}
.hist-week-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.hist-wlbl{font-size:12px;font-weight:600;color:var(--txt2)}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(5,8,16,.9);backdrop-filter:blur(10px);z-index:1000;
  display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity var(--ease)}
.mo.active{opacity:1;pointer-events:all}
.md{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);
  padding:26px;width:100%;max-width:430px;margin:16px;
  transform:translateY(14px);transition:transform var(--ease)}
.mo.active .md{transform:translateY(0)}
.md h3{font-size:18px;font-weight:700;margin-bottom:18px}
.fg{margin-bottom:12px}
.fl{display:block;font-size:11px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.fi{width:100%;padding:10px 13px;background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:var(--rs);color:var(--txt);font-size:13px;outline:none;transition:border-color var(--ease)}
.fi:focus{border-color:var(--blue)}
.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

/* MOBILE */
#mn{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--nh);
  background:rgba(5,8,16,.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);z-index:100}
.mn-wrap{display:flex;height:100%}
.mn-i{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;cursor:pointer;color:var(--txt3);font-size:9px;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;transition:color var(--ease)}
.mn-i.active{color:var(--blue)}
.mn-i svg{width:20px;height:20px;stroke-width:2}

/* TOAST */
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(10px);
  background:rgba(15,22,40,.97);backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:99px;
  padding:9px 20px;font-size:12px;color:var(--txt);z-index:9999;
  opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* PAGE HEADER */
.ph{margin-bottom:22px}
.ph h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.ph-sub{font-size:13px;color:var(--txt3);margin-top:3px}

/* SECTION TITLE */
.sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--txt3);margin-bottom:10px}

/* ANIM */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.ain{animation:fadeUp .3s ease forwards}

/* RESPONSIVE */
@media(max-width:860px){
  #sb{display:none}#mn{display:flex}
  .view{padding:16px 16px 72px}
  .mod-grid{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}
  .hero-score{display:none}.hero-title{font-size:26px}
  .cli-grid{grid-template-columns:1fr}
}
@media(max-width:500px){.mod-grid,.g4,.g3,.g2{grid-template-columns:1fr}.sat-num{font-size:36px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="app">
  <nav id="sb">
    <div class="sb-logo"><h1>VIDINHA</h1><p>do Jessé</p></div>
    <div class="nav-list" id="nav-list"></div>
    <div class="sb-foot">
      <div class="sb-ov-l">Status geral</div>
      <div class="sb-ov-v" id="sb-ov">—</div>
      <button class="btn btn-ghost" style="margin-top:10px;width:100%;font-size:11px;justify-content:flex-start;padding:6px 0;color:var(--txt3)" onclick="openResetModal()">↺ Reiniciar semana</button>
    </div>
  </nav>
  <div id="ct">
    <section class="view active" id="view-dashboard"></section>
    <section class="view" id="view-clients"></section>
    <section class="view" id="view-physical"></section>
    <section class="view" id="view-productivity"></section>
    <section class="view" id="view-routine"></section>
    <section class="view" id="view-history"></section>
  </div>
</div>
<nav id="mn"><div class="mn-wrap" id="mn-wrap"></div></nav>
<div class="mo" id="mo"><div class="md" id="md"></div></div>
<div id="toast"></div>

<script>
// ===================== CONFIG =====================
const DAYS=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const DOWS=['mon','tue','wed','thu','fri','sat','sun'];

const DEF_CLIENTS=[
  {id:1,name:'Cheney The Square',value:697,dueDay:21,boletoDay:15,status:'pendente',sat:'corre_negada',obs:''},
  {id:2,name:'Mr. Cheney Santana',value:900,dueDay:28,boletoDay:26,status:'pendente',sat:'corre_negada',obs:''},
  {id:3,name:'Cheney Maceió',value:650,dueDay:10,boletoDay:null,status:'pago',sat:'felizao',obs:''},
  {id:4,name:'Cheney Limeira',value:1450,dueDay:1,boletoDay:28,status:'pago',sat:'felizao',obs:''},
  {id:5,name:'Hortvs SPA',value:1550,dueDay:10,boletoDay:5,status:'pago',sat:'felizao',obs:''},
  {id:6,name:'Luciana Mel',value:1000,dueDay:18,boletoDay:14,status:'pago',sat:'felizao',obs:''},
  {id:7,name:'Cheney Maceió',value:650,dueDay:29,boletoDay:25,status:'pendente',sat:'fica_esperto',obs:'Unidade 2'},
  {id:8,name:'Crepefy Balneário',value:900,dueDay:10,boletoDay:5,status:'pendente',sat:'fica_esperto',obs:''},
  {id:9,name:'Crepefy Parnaíba',value:900,dueDay:29,boletoDay:25,status:'pendente',sat:'fica_esperto',obs:''},
  {id:10,name:'Mr. Cheney Top Center',value:0,dueDay:null,boletoDay:null,status:'nao_pagante',sat:'felizao',obs:'Não pagante'}
];

const DEF_TASKS=[
  {id:'oracao',name:'Oração',bad:0,ok:4,ideal:7,isDefault:true},
  {id:'agenda',name:'Agenda',bad:0,ok:4,ideal:7,isDefault:true}
];

// ===================== FRASES =====================
const FRASES={
  // CLIENTES
  cli:{
    excelente:['Carteira saudável. Clientes no verde.','Todos felizes, caixa no ritmo.','Gestão impecável, nenhum em risco.'],
    ok:['Semana tranquila nos clientes.','Maioria feliz. Continua assim.','Clima estável por enquanto.'],
    atencao:['Fica esperto. Tem cliente nervoso.','Clima estranho no ar.','Sinal amarelo. Atenção redobrada.','Tem cliente olhando pro concorrente.'],
    critico:['Acorda meu fi! Clientes sofrendo.','Corre negada detectado. Faz alguma coisa.','Tem clientes sofrendo emocionalmente na sua mão.','3 clientes gritando e você tá dormindo?']
  },

// ===================== DATE =====================
function td(){return new Date().toISOString().split('T')[0];}

function wk(dateStr){
  const d=dateStr?new Date(dateStr+'T12:00:00'):new Date();
  const jan4=new Date(d.getFullYear(),0,4);
  const diff=Math.round((d-jan4)/86400000);
  const wn=Math.ceil((diff+jan4.getDay()+1)/7);
  return `${d.getFullYear()}-W${String(wn).padStart(2,'0')}`;
}

function d2dow(ds){const d=new Date(ds+'T12:00:00');return['sun','mon','tue','wed','thu','fri','sat'][d.getDay()];}

function weekDates(offsetWeeks=0){
  const now=new Date();
  const dow=now.getDay();
  const mon=new Date(now);
  mon.setDate(now.getDate()-(dow===0?6:dow-1)+offsetWeeks*7);
  const res=[];const tstr=now.toISOString().split('T')[0];
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    const k=d.toISOString().split('T')[0];
    res.push({k,lbl:DAYS[i].substring(0,3),past:k<tstr,today:k===tstr,future:k>tstr});
  }
  return res;
}

function todayDisp(){return new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function fmtMoney(v){return(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2});}

// ===================== AUDIO =====================
let _actx=null;
function getAC(){
  if(!_actx)try{_actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
  return _actx;
}
function playTone(freq,dur,vol=0.12,type='sine'){
  try{
    const ctx=getAC();if(!ctx)return;
    const o=ctx.createOscillator();const g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.start();o.stop(ctx.currentTime+dur);
  }catch(e){}
}
function sfxClick(){playTone(700,0.07,0.09);}
function sfxOn(){playTone(440,0.07,0.1);setTimeout(()=>playTone(659,0.12,0.1),70);}
function sfxOff(){playTone(400,0.1,0.08,'sawtooth');}
function sfxSuccess(){playTone(440,0.08,0.1);setTimeout(()=>playTone(554,0.08,0.1),80);setTimeout(()=>playTone(659,0.15,0.1),160);}
function sfxWarn(){playTone(300,0.15,0.1,'sawtooth');}

// ===================== CALCULATIONS =====================
function cCliScore(){
  const active=S.clients.filter(c=>c.status!=='nao_pagante');
  if(!active.length)return 50;
  let sat=0;
  active.forEach(c=>{if(c.sat==='felizao')sat+=3;else if(c.sat==='fica_esperto')sat+=2;else sat+=1;});
  return Math.round((sat/(active.length*3))*100);
}

function cliInfo(){
  const corr=S.clients.filter(c=>c.sat==='corre_negada').length;
  const fica=S.clients.filter(c=>c.sat==='fica_esperto').length;
  const feliz=S.clients.filter(c=>c.sat==='felizao').length;
  const pend=S.clients.filter(c=>c.status==='pendente').length;
  const score=cCliScore();
  let color='green',level='excelente';
  if(corr>=2){color='red';level='critico';}
  else if(corr>=1||fica>=4){color='yellow';level='atencao';}
  else if(score>=70){color='green';level='excelente';}
  else{color='green';level='ok';}
  return{color,level,score,corr,fica,feliz,pend};
}

function getWPhys(){
  const w=wk();
  if(!S.phys.weeks[w])S.phys.weeks[w]={musc:{},cardio:{},boxing:0};
  const wk_=S.phys.weeks[w];
  if(!wk_.cardio||typeof wk_.cardio==='number'){wk_.cardio={};}
  return wk_;
}

function totalCardio(){const w=getWPhys();return Object.values(w.cardio||{}).reduce((s,v)=>s+(v||0),0);}

function cPhysScore(){
  const w=getWPhys();
  const md=Object.values(w.musc||{}).filter(Boolean).length;
  const card=totalCardio();
  const ms=md>=5?100:md>=4?85:md>=2?55:md>=1?25:0;
  const cs=card>=60?100:card>=30?65:card>0?30:0;
  const bs=w.boxing>=2?100:w.boxing>=1?60:0;
  return Math.round(ms*.5+cs*.3+bs*.2);
}

function physInfo(){
  const w=getWPhys();
  const md=Object.values(w.musc||{}).filter(Boolean).length;
  const card=totalCardio();
  const score=cPhysScore();
  let color='green',level='excelente';
  if(score<25){color='red';level='critico';}
  else if(score<55){color='yellow';level='atencao';}
  else if(score>=80){color='green';level='excelente';}
  else{color='green';level='ok';}
  return{color,level,score,md,cardio:card,boxing:w.boxing||0};
}

function getTodProd(){
  const d=td();
  if(!S.prod.days[d])S.prod.days[d]={startHour:null,morning:null,afternoon:null};
  return S.prod.days[d];
}

function cProdScore(){
  const wds=weekDates().filter(d=>!d.future);
  if(!wds.length)return 50;
  let tot=0;
  wds.forEach(({k})=>{
    const d=S.prod.days[k];
    if(!d){tot+=25;return;}
    let s=50;
    if(d.startHour!==null){if(d.startHour<=8)s+=20;else if(d.startHour<=9)s+=10;else if(d.startHour>=11)s-=20;else if(d.startHour>=10)s-=8;}
    if(d.morning==='boa')s+=15;else if(d.morning==='ruim')s-=15;
    if(d.afternoon==='boa')s+=15;else if(d.afternoon==='ruim')s-=15;
    tot+=Math.max(0,Math.min(100,s));
  });
  return Math.round(tot/wds.length);
}

function prodInfo(){
  const d=getTodProd();const score=cProdScore();
  let color='green',level='excelente';
  if(!d.startHour&&!d.morning&&!d.afternoon){color='gray';level='atencao';}
  else if(d.startHour>=11){color='red';level='critico';}
  else if(d.startHour>=10||d.morning==='ruim'){color='yellow';level='atencao';}
  else if(score>=75){color='green';level='excelente';}
  else if(score>=55){color='green';level='ok';}
  else{color='yellow';level='atencao';}
  return{color,level,score};
}

function getTodRout(){
  const d=td();
  if(!S.rout.days[d])S.rout.days[d]={};
  return S.rout.days[d];
}

function taskWeekCount(taskId){
  let count=0;
  weekDates().forEach(({k})=>{if(S.rout.days[k]&&S.rout.days[k][taskId])count++;});
  return count;
}

function taskStatus(task){
  const count=taskWeekCount(task.id);
  if(count>=task.ideal)return'green';
  if(count>=task.ok)return'yellow';
  return'red';
}

function cRoutScore(){
  const d=getTodRout();
  const t=S.rout.tasks;
  if(!t.length)return 50;
  const done=t.filter(x=>d[x.id]).length;
  return Math.round((done/t.length)*100);
}

function routInfo(){
  const d=getTodRout();
  const done=S.rout.tasks.filter(t=>d[t.id]).length;
  const total=S.rout.tasks.length;
  const score=cRoutScore();
  let color='green',level='excelente';
  if(done===0){color='red';level='critico';}
  else if(done===total&&total>0){color='green';level='excelente';}
  else if(score>=60){color='green';level='ok';}
  else{color='yellow';level='atencao';}
  return{color,level,score,done,total};
}

function overallScore(){
  return Math.round(cCliScore()*.3+cPhysScore()*.25+cProdScore()*.25+cRoutScore()*.2);
}

function overallInfo(){
  const s=overallScore();
  if(s>=85)return{label:'VIDA ALINHADA',color:'green',level:'excelente'};
  if(s>=70)return{label:'SEMANA FORTE',color:'green',level:'forte'};
  if(s>=55)return{label:'TA BACANINHA',color:'blue',level:'ok'};
  if(s>=40)return{label:'FICA LIGADO',color:'yellow',level:'atencao'};
  if(s>=25)return{label:'MODO SOBREVIVÊNCIA',color:'yellow',level:'critico'};
  return{label:'ACORDA MEU FI',color:'red',level:'critico'};
}

function miniWeekTable(wds){

    {lbl:'Rotina',fn:(k)=>{const d=S.rout.days[k];if(!d)return k<tstr?'r':'e';const done=S.rout.tasks.filter(t=>d[t.id]).length;const tot=S.rout.tasks.length;if(!tot)return'e';if(done===tot)return'g';if(done>0)return'y';return'r';}}
  ];
  let h=`<div style="overflow-x:auto"><table style="border-collapse:separate;border-spacing:0 8px;width:100%">`;
  h+=`<tr><td style="width:78px"></td>${wds.map(d=>`<td style="text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:${d.today?'var(--blue)':'var(--txt3)'};padding-bottom:2px">${d.lbl}</td>`).join('')}</tr>`;
  rows.forEach(row=>{
    h+=`<tr><td style="font-size:12px;color:var(--txt2);font-weight:600;padding-right:6px">${row.lbl}</td>`;
    wds.forEach(({k,today,future})=>{
      const c=future?'e':row.fn(k);

    });
    h+=`</tr>`;
  });
  return h+'</table></div>';
}

// ===================== RENDER: HISTORY =====================
function rHist(){
  const el=document.getElementById('view-history');
  // Last 4 weeks
  const weeks=[-3,-2,-1,0].map(offset=>{
    const wds=weekDates(offset);
    const wkey=wk(wds[0].k);
    const muscDays=wds.filter(({k})=>{const dow=d2dow(k);const w=S.phys.weeks[wkey];return w&&w.musc&&w.musc[dow];}).length;
    const cardTot=wds.reduce((s,{k})=>{const dow=d2dow(k);const w=S.phys.weeks[wkey];if(w&&w.cardio&&w.cardio[dow])return s+w.cardio[dow];return s;},0);
    const prodScores=wds.filter(d=>!d.future).map(({k})=>{const d=S.prod.days[k];if(!d)return 20;let s=50;if(d.startHour!==null){if(d.startHour<=8)s+=20;else if(d.startHour>=11)s-=20;}if(d.morning==='boa')s+=15;else if(d.morning==='ruim')s-=15;if(d.afternoon==='boa')s+=15;else if(d.afternoon==='ruim')s-=15;return Math.max(0,Math.min(100,s));});
    const prodAvg=prodScores.length?Math.round(prodScores.reduce((a,b)=>a+b,0)/prodScores.length):0;
    const routDays=wds.filter(d=>!d.future).filter(({k})=>{const d=S.rout.days[k];if(!d)return false;const tasks=S.rout.tasks;if(!tasks.length)return false;return tasks.filter(t=>d[t.id]).length===tasks.length;}).length;
    const workedDays=wds.filter(d=>!d.future).length;
    const label=offset===0?'Semana atual':offset===-1?'Semana passada':`${Math.abs(offset)} semanas atrás`;
    return{label,wds,muscDays,cardTot,prodAvg,routDays,workedDays};
  });

  el.innerHTML=`
  <div class="ph ain"><h2>Histórico</h2><p class="ph-sub">Últimas 4 semanas</p></div>
  ${weeks.reverse().map((w,i)=>`
  <div class="hist-week ain">
    <div class="hist-week-head">
      <div class="hist-wlbl">${w.label}</div>
      <div style="display:flex;gap:6px">
        <span class="badge b-${w.muscDays>=4?'g':w.muscDays>=2?'y':'r'}">${w.muscDays} treinos</span>
        <span class="badge b-${w.cardTot>=60?'g':w.cardTot>=20?'y':'r'}">${w.cardTot} min cardio</span>
        <span class="badge b-${w.prodAvg>=70?'g':w.prodAvg>=50?'y':'r'}">Prod ${w.prodAvg}%</span>
        <span class="badge b-${w.routDays>=5?'g':w.routDays>=3?'y':'r'}">${w.routDays}/${w.workedDays} rotinas</span>
      </div>
    </div>
    <div style="display:flex;gap:6px">${w.wds.map(({k,lbl,future})=>{
      const dow=d2dow(k);const wobj=S.phys.weeks[wk(w.wds[0].k)]||{};const musc=wobj.musc&&wobj.musc[dow];
      const col=musc?'md-g':future?'md-e':'md-r';
      return`<div style="text-align:center"><div style="font-size:9px;color:var(--txt3);margin-bottom:2px">${lbl}</div><div class="mday ${col}" style="width:28px;height:28px;font-size:10px">${musc?'✓':future?'·':'·'}</div></div>`;
    }).join('')}</div>
  </div>`).join('')}`;
}

// ===================== PARTICLES =====================
function initParts(){
  const cv=document.getElementById('cv');const cx=cv.getContext('2d');let ps=[];
  function resize(){cv.width=window.innerWidth;cv.height=window.innerHeight;}
  function mkP(){
    ps=[];const n=Math.min(60,Math.floor(window.innerWidth/16));
    for(let i=0;i<n;i++)ps.push({x:Math.random()*cv.width,y:Math.random()*cv.height,
      sz:Math.random()*1.4+.3,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,
      a:Math.random()*.35+.06});
  }
  function draw(){
    cx.clearRect(0,0,cv.width,cv.height);
    const alpha=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--env-alpha'))||0.5;
    const intensity=pIntensity;
    ps.forEach(p=>{
      p.x+=p.vx*intensity;p.y+=p.vy*intensity;
      if(p.x<0)p.x=cv.width;if(p.x>cv.width)p.x=0;
      if(p.y<0)p.y=cv.height;if(p.y>cv.height)p.y=0;
      cx.beginPath();cx.arc(p.x,p.y,p.sz,0,Math.PI*2);
      cx.fillStyle=`rgba(${pColor},${p.a*intensity})`;cx.fill();
    });
    for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){
      const dx=ps[i].x-ps[j].x,dy=ps[i].y-ps[j].y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<100){cx.beginPath();cx.moveTo(ps[i].x,ps[i].y);cx.lineTo(ps[j].x,ps[j].y);
        cx.strokeStyle=`rgba(${pColor},${.035*(1-d/100)*intensity})`;cx.lineWidth=.5;cx.stroke();}
    }
    requestAnimationFrame(draw);
  }
  resize();mkP();draw();
  window.addEventListener('resize',()=>{resize();mkP();});
}
